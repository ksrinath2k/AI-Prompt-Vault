[build]
  publish = "."
  functions = "netlify/functions"

[functions]
  node_bundler = "esbuild"
  external_node_modules = ["@netlify/blobs", "express", "instagram-url-direct", "serverless-http", "youtubei.js"]

[[redirects]]
  from = "/api/*"
  to = "/.netlify/functions/api/:splat"
  status = 200
  force = true

[[redirects]]
  from = "/vault-admin-8c7f5k2m"
  to = "/.netlify/functions/api/vault-admin-8c7f5k2m"
  status = 200
  force = true

[[redirects]]
